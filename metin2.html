<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="mobile-web-app-capable" content="yes">
<title>Metin2-Multiversum – dein Begleiter für Ruby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="capacitor.js" onerror="this.remove()"></script>
<style>
:root{
  --bg:#0b0a1a; --panel:#15122c; --panel2:#201c3f; --line:#2f2a58; --text:#efecff; --mute:#9c95c8;
  --grad:linear-gradient(120deg,#6fe3ff 0%,#a78bff 55%,#e59bff 100%); --glow:0 0 18px rgba(130,110,255,.45);
  --acc:#7fe3ff; --ok:#3fd68a; --bad:#ff5c6c;
  
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Space Grotesk",system-ui,sans-serif}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(98,70,230,.35),transparent 60%),radial-gradient(ellipse 80% 50% at 100% 100%,rgba(70,200,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 34% 72%,#cfc6ff,transparent),radial-gradient(1px 1px at 88% 64%,#fff,transparent),radial-gradient(1px 1px at 55% 38%,#bfefff,transparent),radial-gradient(1.5px 1.5px at 6% 88%,#fff,transparent),radial-gradient(1px 1px at 66% 90%,#fff,transparent),radial-gradient(1px 1px at 22% 46%,#fff,transparent),radial-gradient(1px 1px at 93% 32%,#e3d9ff,transparent),radial-gradient(1px 1px at 44% 8%,#fff,transparent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100%}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto}
.view.on{display:block}
.pad{padding:calc(14px + var(--safe-t)) 14px 96px}
/* Navigation unten (wie TCG Multiversum) */
nav{display:flex;background:rgba(17,14,38,.92);backdrop-filter:blur(10px);border-top:1px solid transparent;border-image:var(--grad) 1;padding-bottom:var(--safe-b);position:relative;z-index:5}
nav button{flex:1;min-width:0;padding:10px 0 8px;color:var(--mute);font-size:11px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc);text-shadow:0 0 12px rgba(127,227,255,.6)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(127,227,255,.7))}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--grad);color:#0b0a1a;font-size:10px;font-weight:800;line-height:16px}
nav .badge:empty{display:none}
/* Listen */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 12px 12px;border-radius:18px;background:linear-gradient(160deg,rgba(40,33,84,.9),rgba(22,18,46,.9));border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .12s;min-width:0}
.tile:active{transform:scale(.96)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(rgba(167,139,255,.22),transparent 70%)}
.tile .ti{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(0,0,0,.35);margin-bottom:6px}
.tile .tt{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{font-size:12px;color:var(--mute);line-height:1.3}
.tile.new{border-style:dashed;align-items:center;justify-content:center;color:var(--mute);min-height:128px}
.tile.new .ti{background:var(--panel2);color:var(--acc);border:1px solid var(--line)}
.lhead{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.lhead .lic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.lhead h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;z-index:2}
.addrow input{flex:1;font-size:16px;padding:12px 13px;border-radius:12px}
.addrow button{width:48px;border-radius:12px;background:var(--grad);color:#0b0a1a;display:grid;place-items:center;box-shadow:var(--glow);flex:none}
.addrow button svg{width:24px;height:24px}
.li{display:flex;align-items:center;gap:10px;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:13px;padding:4px 6px 4px 4px;margin-bottom:6px}
.li .ck{width:42px;height:42px;display:grid;place-items:center;flex:none}
.li .ck i{width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;transition:all .15s}
.li.done .ck i{background:var(--ok);border-color:var(--ok)}
.li.done .ck i::after{content:"";width:10px;height:5px;border:2.5px solid #0b2416;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.li .tx{flex:1;min-width:0;text-align:left;padding:9px 4px;word-break:break-word}
.li .tx small{display:block;color:var(--mute);font-size:11px}
.li.done .tx{color:var(--mute);text-decoration:line-through}
.li .who{width:8px;height:8px;border-radius:50%;flex:none;margin-right:6px}
.dhead{display:flex;align-items:center;justify-content:space-between}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px}
.icons button.on{border-color:var(--acc);box-shadow:var(--glow)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.cols button.on{border-color:#fff;box-shadow:var(--glow)}
h1{font-size:24px;margin:0;background:linear-gradient(90deg,#ffffff,#c9bcff 60%,#8fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:18px 0 8px;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:18px 10px;font-size:14px}
/* Kopf */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hlogo{width:62px;height:62px;border-radius:17px;box-shadow:0 0 24px rgba(130,110,255,.55),0 0 0 1px rgba(167,139,255,.5);animation:hfloat 5s ease-in-out infinite;flex:none}
@keyframes hfloat{50%{transform:translateY(-4px) rotate(-2deg)}}
.hero .sub{color:var(--mute);font-size:13px;margin-top:2px}
.gearbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);color:var(--acc);box-shadow:var(--glow);flex:none}
.gearbtn svg{width:22px;height:22px;transition:transform .5s}
.gearbtn:active svg{transform:rotate(90deg)}
.hstats{display:flex;gap:8px;margin-bottom:14px}
.hstats div{flex:1;min-width:0;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.hstats b{display:block;font-size:19px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats span{font-size:11px;color:var(--mute)}
/* Monatskarte */
.card{border-radius:18px;background:linear-gradient(160deg,rgba(40,33,84,.9),rgba(22,18,46,.9));border:1px solid var(--line);padding:10px 10px 12px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(rgba(167,139,255,.22),transparent 70%);pointer-events:none}
.mhead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.mhead .t{flex:1;text-align:center;font-weight:700;font-size:18px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(22,24,31,.6);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px}
.chip{padding:7px 12px;border-radius:99px;background:rgba(22,24,31,.85);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip.on{background:var(--grad);color:#0b0a1a;border-color:transparent;box-shadow:var(--glow)}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd span{text-align:center;font-size:11px;color:var(--mute);padding:4px 0}
.wd span:nth-child(n+6){color:#c9a6ff}
.day{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;position:relative;transition:transform .1s}
.day:active{transform:scale(.92)}
.day.other{opacity:.28}
.day.today{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc);font-weight:700}
/* Countdowns & Hinweise */
.cds{display:flex;gap:8px;overflow-x:auto;margin:-4px -14px 14px;padding:4px 14px;scrollbar-width:none}
.cds::-webkit-scrollbar{display:none}
.cd{flex:none;min-width:130px;max-width:170px;text-align:left;border-radius:16px;padding:10px 12px;background:linear-gradient(150deg,rgba(111,227,255,.16),rgba(229,155,255,.16));border:1px solid rgba(167,139,255,.45);box-shadow:0 0 14px rgba(130,110,255,.25)}
.cd b{display:block;font-size:24px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cd span{display:block;font-size:12px;color:var(--mute)}
.cd .t{color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hints{display:flex;flex-direction:column;gap:6px;margin:-4px 0 14px}
.hint{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:12px;background:rgba(27,23,56,.82);border:1px solid var(--line);font-size:14px}
.hint.warn{border-color:rgba(255,177,61,.5);background:rgba(255,177,61,.10)}
.hint.bad{border-color:rgba(255,92,108,.5);background:rgba(255,92,108,.10)}
.spec.waste{background:rgba(160,160,180,.10)}
.spec.dog{background:rgba(255,177,61,.10);border-color:rgba(255,177,61,.35)}
/* Essen */
.wnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wnav .t{flex:1;text-align:center;font-weight:700}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:7px}
.meal .dd{width:44px;flex:none;text-align:center;line-height:1.15}
.meal .dd b{display:block;font-size:18px}
.meal .dd span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.meal.today{border-color:var(--acc);box-shadow:0 0 12px rgba(127,227,255,.25)}
.meal .mn{flex:1;min-width:0}
.meal .mn b{display:block}
.meal .mn small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .mn .plan{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* Pinnwand */
.notes{columns:2;column-gap:10px}
.notec{break-inside:avoid;display:block;width:100%;text-align:left;margin-bottom:10px;border-radius:14px;padding:11px 12px;border:1px solid var(--line);position:relative;overflow:hidden;background:rgba(27,23,56,.9)}
.notec::before{content:"";position:absolute;left:0;top:0;right:0;height:4px}
.notec b{display:block;margin-bottom:4px}
.notec p{margin:0;font-size:13px;color:#d9d3ff;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:hidden}
.notec small{display:block;margin-top:6px;font-size:11px;color:var(--mute)}
/* Hund & Müll */
.care{display:flex;align-items:center;gap:10px;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px}
.care .ic{font-size:24px;width:32px;text-align:center;flex:none}
.care .cm{flex:1;min-width:0;text-align:left}
.care .cm b{display:block}
.care .cm small{display:block;font-size:12px;color:var(--mute)}
.care .st{font-size:12px;font-weight:700}
.care .ok{flex:none;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--ok)}
.st.bad{color:var(--bad)} .st.warn{color:#ffb13d} .st.good{color:var(--ok)}
.bin{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:6px}
.dots i.w{border-radius:1.5px}
.subhead{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.subhead h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .mb{position:absolute;left:-2px;right:-2px;height:4px;pointer-events:none}
.day.fer{background:rgba(125,255,181,.17)}
.day.hol>span:first-child{color:#ff9ab0;font-weight:700}
.day.sel.hol>span:first-child{color:#7a0b2c}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.spec{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:14px;border:1px solid var(--line)}
.spec.hol{background:rgba(255,154,176,.12);border-color:rgba(255,154,176,.35)}
.spec.fer{background:rgba(125,255,181,.09);border-color:rgba(125,255,181,.3)}
.spec small{display:block;color:var(--mute);font-size:12px}
.day.sel{background:var(--grad);color:#0b0a1a;font-weight:700;box-shadow:var(--glow)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.day.sel .dots i{box-shadow:0 0 0 1px rgba(11,10,26,.6)}
/* Termine */
.ev{display:flex;gap:10px;align-items:stretch;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.ev:active{transform:scale(.98)}
.ev .bar{width:4px;border-radius:4px;flex:none}
.ev .tm{width:58px;flex:none;font-weight:700;font-size:14px}
.ev .tm small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.ev .mid{flex:1;min-width:0}
.ev .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ev .meta{font-size:12px;color:var(--mute);margin-top:1px}
.ev .note{font-size:13px;color:#cfc8f5;margin-top:3px;white-space:pre-wrap}
.ev .dt{font-size:12px;color:var(--acc);margin-bottom:1px}
#fab{position:fixed;right:18px;bottom:calc(74px + var(--safe-b));width:62px;height:62px;border-radius:50%;background:var(--grad);color:#0b0a1a;box-shadow:0 0 0 3px rgba(167,139,255,.35),0 0 26px rgba(127,227,255,.55);display:grid;place-items:center;z-index:10;transition:transform .1s}
#fab:active{transform:scale(.92)}
#fab svg{width:30px;height:30px}
/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .25s ease;z-index:20;overflow-y:auto;padding:8px 16px calc(18px + var(--safe-b))}
#sheet.on{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}
#scrim.on{display:block}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 12px}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:#7a6cff}
textarea{min-height:64px;resize:vertical}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--grad);color:#0b0a1a;border-color:transparent;font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px}
.tog{width:46px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.tog.on{background:rgba(127,227,255,.25);border-color:var(--acc)}
.tog.on::after{transform:translateX(20px);background:var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:120px;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-weight:500;text-align:center;text-decoration:none;color:var(--text)}
.btn.pri{background:var(--grad);color:#0b0a1a;border-color:transparent;font-weight:700;box-shadow:var(--glow)}
.btn.del{color:var(--bad);border-color:rgba(255,92,108,.4)}
.set-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row input[type=text]{flex:1}
.set-row input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:3px;flex:none}
#toast{position:fixed;z-index:50;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-150%);background:var(--panel2);border:1px solid var(--line);
  padding:9px 16px;border-radius:99px;transition:transform .25s;font-size:14px;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}

/* ===== Metin2-Multiversum: Ergänzungen ===== */
:root{--gold:#ffcf6b;--ruby:#ff5c8a}
.hstats b.g{background:linear-gradient(90deg,#ffe29a,#ffb13d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox{display:flex;gap:8px;margin-bottom:10px;position:sticky;top:0;z-index:2;padding-top:2px;background:linear-gradient(var(--bg) 70%,transparent)}
.sbox input{flex:1;font-size:16px;padding:12px 13px;border-radius:12px;width:100%;background:var(--panel2);border:1px solid var(--line);outline:none}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px}
.row:active{transform:scale(.985)}
.row .ic{font-size:22px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{text-align:right;flex:none;font-size:13px}
.row .rt b{display:block;font-size:15px}
.row .rt small{color:var(--mute);font-size:11px}
.up{color:var(--bad)} .down{color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;vertical-align:1px}
.tag.cheap{background:rgba(63,214,138,.18);color:var(--ok)}
.tag.dear{background:rgba(255,92,108,.16);color:var(--bad)}
.tag.lv{background:var(--panel2);color:var(--acc);border:1px solid var(--line)}
.tag.metin{background:rgba(255,207,107,.15);color:var(--gold)}
/* Farm-Session */
.sess{border-radius:18px;padding:14px;margin-bottom:14px;background:linear-gradient(150deg,rgba(255,207,107,.14),rgba(167,139,255,.16));border:1px solid rgba(255,207,107,.45);box-shadow:0 0 18px rgba(255,177,61,.18)}
.sess .top{display:flex;align-items:center;gap:10px}
.sess .top b{font-size:17px}
.sess .top small{display:block;color:var(--mute);font-size:12px}
.kills{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.kills .n{flex:1;text-align:center;font-size:34px;font-weight:700;background:linear-gradient(90deg,#ffe29a,#ffb13d);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.kills .n small{display:block;font-size:11px;color:var(--mute);-webkit-text-fill-color:var(--mute);font-weight:400;margin-top:4px}
.kbtn{min-width:74px;height:60px;border-radius:16px;background:var(--grad);color:#0b0a1a;font-weight:800;font-size:20px;box-shadow:var(--glow)}

.kbtn:active{transform:scale(.93)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dchips button{padding:7px 11px;border-radius:99px;background:rgba(22,24,31,.85);border:1px solid var(--line);font-size:13px}
.dchips button b{color:var(--gold);margin-left:4px}
.dchips button:active{transform:scale(.94)}
/* Diagramm */
.chart{width:100%;height:170px;display:block}
.chart .ln{fill:none;stroke:url(#cg);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#ca);opacity:.5}
.chart text{fill:var(--mute);font-size:10px;font-family:inherit}
.chart .avg{stroke:var(--mute);stroke-dasharray:4 4;stroke-width:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.kv span{display:block;font-size:11px;color:var(--mute)}
.kv b{font-size:15px}
.dcat{margin:12px 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.ilist{display:flex;flex-wrap:wrap;gap:6px}
.ilist button{padding:7px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;text-align:left}
.ilist button.have{border-color:rgba(255,207,107,.6);color:var(--gold)}
.sugg{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:200px;overflow-y:auto;display:none}
.sugg.on{display:block}
.sugg button{display:block;width:100%;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:14px}
.sugg button small{color:var(--mute);margin-left:6px}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daysel button{padding:9px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.daysel button.on{background:var(--grad);color:#0b0a1a;font-weight:700;border-color:transparent}
.ev.live{border-color:var(--ok);box-shadow:0 0 14px rgba(63,214,138,.3)}
.ev .ic{font-size:24px;width:34px;text-align:center;flex:none;align-self:center}
.cd.live{border-color:var(--ok);background:linear-gradient(150deg,rgba(63,214,138,.2),rgba(127,227,255,.12))}
.cd .ic{float:right;font-size:20px}
.bar2{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar2 i{display:block;height:100%;background:var(--grad);border-radius:6px}
</style>

  <linearGradient id="ca" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a78bff" stop-opacity=".6"/><stop offset="1" stop-color="#a78bff" stop-opacity="0"/></linearGradient>
</defs></svg>

<script>
const APP_BUILD = 0; // wird beim Bauen der APK durch die Build-Nummer ersetzt
const UPDATE_INFO = 'https://raw.githubusercontent.com/MrDocMoris/Metin2-Multiversum/main/app/version.json';
const WIKI_INFO = 'https://raw.githubusercontent.com/MrDocMoris/Metin2-Multiversum/main/daten/wiki.json';
const WIKI_BASE = 'https://de-wiki.metin2.gameforge.com/index.php/';
const OFF_INFO = 'https://raw.githubusercontent.com/MrDocMoris/Metin2-Multiversum/main/daten/events.json';

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); $('#sheet').scrollTop = 0; }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* Android-App (Capacitor) */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const _plugs = {};
function plug(name){
  if(!NATIVE) return null;
  if(!_plugs[name]) _plugs[name] = (window.capacitorExports && window.capacitorExports.registerPlugin) ? window.capacitorExports.registerPlugin(name) : window.Capacitor.Plugins[name];
  return _plugs[name];
}
function openUrl(url){ if(NATIVE) plug('Browser').open({url}).catch(() => { location.href = url; }); else window.open(url, '_blank'); }

/* ================= Daten (offline, auf dem Gerät) ================= */
const S = {
  cfg: Object.assign({char:'', cls:'Schamane', lvl:'', server:'Ruby', notify:true, remind:15, offNotify:'fav', offFav:[], newsNotify:true}, store('m2_cfg') || {}),
  off: store('m2_off') || null, // Event-Termine aus dem offiziellen Forum
  events: store('m2_events') || [],
  drops: store('m2_drops') || [],
  sessions: store('m2_sessions') || [],
  prices: store('m2_prices') || [],
  active: store('m2_active') || null, // laufende Farm-Session
  wiki: null, update: null, view: 'home',
};
const saveCfg = () => { store('m2_cfg', S.cfg); scheduleReminders(); autoBackup(); };
const saveEvents = () => { store('m2_events', S.events); scheduleReminders(); autoBackup(); };
const saveDrops = () => { store('m2_drops', S.drops); autoBackup(); };
const saveSessions = () => { store('m2_sessions', S.sessions); store('m2_active', S.active); autoBackup(); };
const savePrices = () => { store('m2_prices', S.prices); autoBackup(); };

/* Datum-Helfer */
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const wdOf = s => (parse(s).getDay() + 6) % 7; // Mo = 0
const hm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function fmtDay(ds){ const t = todayStr(); if(ds === t) return 'Heute'; if(ds === addDays(t, 1)) return 'Morgen'; if(ds === addDays(t, -1)) return 'Gestern'; const d = parse(ds); return `${WD[wdOf(ds)]}, ${d.getDate()}.${d.getMonth() + 1}.`; }
function fmtDur(ms){ const m = Math.max(0, Math.round(ms / 60000)); if(m < 60) return `${m} Min`; const h = Math.floor(m / 60); if(h < 48) return `${h} Std ${m % 60 ? (m % 60) + ' Min' : ''}`.trim(); return `${Math.round(h / 24)} Tage`; }

/* ================= Yang: Eingabe & Anzeige ================= */
// Versteht: 1500000 · 1.500.000 · 1,5kk · 2kkk · 250k · 3 Won · 1,2 Mio
function parseYang(s){
  s = String(s ?? '').trim().toLowerCase().replace(/\s+/g, '').replace(/yang$/, '');
  if(!s) return null;
  const m = s.match(/^(\d+(?:[.,]\d+)*)(won|w|kkk|kk|k|mio|mrd)?$/);
  if(!m) return null;
  let n = m[1];
  if(!m[2] && /^\d{1,3}([.]\d{3})+$/.test(n)) n = n.replace(/\./g, '');
  else if(/^\d{1,3}([.]\d{3})+,\d+$/.test(n)) n = n.replace(/\./g, '').replace(',', '.');
  else n = n.replace(',', '.');
  const v = parseFloat(n); if(!isFinite(v)) return null;
  const mul = {won:1e8, w:1e8, kkk:1e9, kk:1e6, k:1e3, mio:1e6, mrd:1e9}[m[2]] || 1;
  return Math.round(v * mul);
}
function fmtYang(n, long){
  if(n == null || !isFinite(n)) return '–';
  const f = (x, d) => x.toLocaleString('de-DE', {maximumFractionDigits:d});
  if(long) return f(n, 0) + ' Yang';
  if(n >= 1e8) return f(n / 1e8, 2) + ' Won';
  if(n >= 1e6) return f(n / 1e6, n >= 1e7 ? 0 : 1) + 'kk';
  if(n >= 1e3) return f(n / 1e3, 0) + 'k';
  return f(n, 0);
}

/* ================= Wiki-Datenbank ================= */
const CAT_NAMES = {w:'⚔️ Waffen', r:'🛡️ Rüstungen', s:'💍 Schmuck', u:'⬆️ Upp-Items', b:'📘 Lehrbücher', o:'🎁 Sonstiges'};
function setWiki(data){
  if(!data || !Array.isArray(data.eintraege)) return false;
  const items = new Map();
  data.eintraege.forEach(e => {
    e.key = (e.n || '').toLowerCase();
    Object.entries(e.d || {}).forEach(([cat, list]) => list.forEach(name => {
      const k = name.toLowerCase();
      if(!items.has(k)) items.set(k, {n:name, cat, from:[]});
      items.get(k).from.push(e);
    }));
  });
  data.items = items;
  data.byKey = new Map(data.eintraege.map(e => [e.key, e]));
  S.wiki = data;
  return true;
}
async function loadWiki(){
  const cached = store('m2_wiki');
  if(cached) setWiki(cached);
  if(!S.wiki){ // mitgelieferte Daten aus der App
    try{ const r = await fetch('wiki.json'); if(r.ok){ const d = await r.json(); if(setWiki(d)) store('m2_wiki', d); } }catch(e){}
  }
  if(S.wiki) renderAll();
  const last = store('m2_wikicheck');
  if(!last || Date.now() - last > 864e5) refreshWiki(false);
}
async function refreshWiki(manual){
  try{
    const r = await fetch(WIKI_INFO + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status === 404 ? 'Noch keine Wiki-Daten im Repo' : 'Fehler ' + r.status);
    const d = await r.json();
    store('m2_wikicheck', Date.now());
    if(!S.wiki || d.stand !== S.wiki.stand || manual){ if(setWiki(d)){ store('m2_wiki', d); if(manual) toast(`📚 Wiki-Daten vom ${fmtDate(d.stand)} geladen`); renderAll(); } }
    else if(manual) toast('Wiki-Daten sind aktuell');
  }catch(e){ if(manual) toast(e.message && !/fetch/i.test(e.message) ? e.message : 'Keine Verbindung'); }
}
const fmtDate = s => s ? parse(s).toLocaleDateString('de-DE') : '–';
const wikiEntry = name => S.wiki && S.wiki.byKey.get(String(name || '').toLowerCase());
const wikiItem = name => S.wiki && S.wiki.items.get(String(name || '').toLowerCase());
function entryIcon(e){ return e.t === 'metin' ? '🪨' : e.st >= 5 ? '👹' : e.st >= 3 ? '💀' : '🐺'; }
function itemIcon(cat){ return ({w:'⚔️', r:'🛡️', s:'💍', u:'⬆️', b:'📘', o:'🎁'})[cat] || '🎁'; }

/* Vorschläge beim Tippen (Monster/Metins oder Items) */
function suggest(input, kind, onPick){
  const box = document.createElement('div'); box.className = 'sugg'; input.after(box);
  const run = () => {
    const q = input.value.trim().toLowerCase();
    if(q.length < 2){ box.classList.remove('on'); return; }
    let res = [];
    const own = kind === 'item' ? [...new Set([...S.drops.map(d => d.item), ...S.prices.map(p => p.item)])] : [...new Set(S.sessions.map(s => s.mob).concat(S.drops.map(d => d.mob)).filter(Boolean))];
    own.filter(n => n.toLowerCase().includes(q)).slice(0, 4).forEach(n => res.push({n, s:'zuletzt'}));
    if(S.wiki){
      if(kind === 'item') for(const it of S.wiki.items.values()){ if(res.length > 12) break; if(it.n.toLowerCase().includes(q) && !res.some(r => r.n === it.n)) res.push({n:it.n, s:CAT_NAMES[it.cat]}); }
      else for(const e of S.wiki.eintraege){ if(res.length > 12) break; if(e.key.includes(q) && !res.some(r => r.n === e.n)) res.push({n:e.n, s:e.lv ? 'Lv ' + e.lv : ''}); }
    }
    if(!res.length){ box.classList.remove('on'); return; }
    box.innerHTML = res.map((r, i) => `<button data-i="${i}">${esc(r.n)}<small>${esc(r.s || '')}</small></button>`).join('');
    box.classList.add('on');
    box.querySelectorAll('button').forEach(b => b.onclick = () => { input.value = res[+b.dataset.i].n; box.classList.remove('on'); onPick && onPick(input.value); });
  };
  input.addEventListener('input', run);
  input.addEventListener('blur', () => setTimeout(() => box.classList.remove('on'), 200));
}

/* ================= Offizielle Events (Forum: Eventkalender & News) ================= */
async function refreshOff(manual){
  try{
    const r = await fetch(OFF_INFO + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status === 404 ? 'Noch keine Forum-Daten im Repo' : 'Fehler ' + r.status);
    const d = await r.json();
    store('m2_offcheck', Date.now());
    const changed = !S.off || d.stand !== S.off.stand;
    S.off = d; store('m2_off', d);
    if(changed){ scheduleReminders(); renderAll(); }
    if(manual) toast(changed ? '📅 Event-Termine aktualisiert' : 'Event-Termine sind aktuell');
  }catch(e){ if(manual) toast(e.message && !/fetch/i.test(e.message) ? e.message : 'Keine Verbindung'); }
}
function maybeRefreshOff(){ const t = store('m2_offcheck'); if(!t || Date.now() - t > 3 * 3600e3) refreshOff(false); }
// Wochenplan des eigenen Servers (Name aus den Einstellungen, sonst Ruby)
function myPlan(){
  const pl = (S.off && S.off.plaene) || [], q = (S.cfg.server || 'Ruby').toLowerCase();
  return pl.find(p => p.server.toLowerCase().includes('[' + q) || p.server.toLowerCase().includes(q)) || pl.find(p => /ruby/i.test(p.server)) || null;
}
const atTime = (ds, t) => { const [h, m] = t.split(':').map(Number); const d = parse(ds); d.setHours(h, m, 0, 0); return d.getTime(); };
const isFav = name => S.cfg.offFav.some(f => f.toLowerCase() === String(name).toLowerCase());
function toggleFav(name){
  if(isFav(name)) S.cfg.offFav = S.cfg.offFav.filter(f => f.toLowerCase() !== name.toLowerCase());
  else S.cfg.offFav.push(name);
  saveCfg(); toast(isFav(name) ? `🔔 Erinnerung für „${name}“ an` : `🔕 Erinnerung für „${name}“ aus`);
  if(isFav(name) && NATIVE) askNotify(false);
}
const offWanted = name => S.cfg.offNotify === 'all' || (S.cfg.offNotify === 'fav' && isFav(name));
// Termine aus dem Forum für die nächsten n Tage: {e:{id,name,icon,start,end,note}, ds, start, end, hasEnd, off:true}
function offOccurrences(days = 7, fromDs){
  const out = [], now = Date.now(), t0 = fromDs || addDays(todayStr(), -1), plan = myPlan();
  if(plan) for(let i = 0; i <= days; i++){
    const ds = addDays(t0, i);
    (plan.woche[String(wdOf(ds))] || []).forEach(x => {
      const st = atTime(ds, x.von), en = x.bis === '24:00' ? atTime(addDays(ds, 1), '00:00') : atTime(ds, x.bis);
      if(en > now) out.push({off:'drop', ds, start:st, end:en, hasEnd:true, e:{id:'off-' + x.name, icon:'🎁', name:x.name, start:x.von, end:x.bis === '24:00' ? '00:00' : x.bis, note:'Drop von Bossen und Steinen'}});
    });
    (plan.extra || []).filter(x => x.datum === ds).forEach(x => {
      const st = atTime(ds, x.von), en = x.bis === '24:00' ? atTime(addDays(ds, 1), '00:00') : atTime(ds, x.bis);
      if(en > now) out.push({off:'extra', ds, start:st, end:en, hasEnd:true, e:{id:'offx-' + x.name, icon:'⛏️', name:x.name, start:x.von, end:x.bis, note:'Zusätzliches Event'}});
    });
  }
  ((S.off && S.off.news) || []).forEach(n => {
    const st = n.start ? new Date(n.start).getTime() : null, en = n.ende ? new Date(n.ende).getTime() : null;

const EV_TEMPLATES = [
  ['⭐', 'EXP-Event'], ['💰', 'Yang-Event'], ['🎁', 'Drop-Event'], ['🍀', 'Happy Hour'], ['🪨', 'Metin-Fieber'], ['👹', 'Boss-Event'],
  ['🎣', 'Angel-Event'], ['⚔️', 'Gildenkrieg'], ['🎃', 'Saison-Event'], ['🏆', 'Turnier / OX'], ['🧭', 'Dungeon-Termin'], ['📌', 'Eigenes'],
];
const REMINDS = [[0, 'Beim Start'], [5, '5 Min'], [15, '15 Min'], [30, '30 Min'], [60, '1 Std'], [-1, 'Keine']];
function occursOn(e, ds){
  if(e.from && ds < e.from) return false;
  if(e.until && ds > e.until) return false;
  if(e.rep === 'once') return e.date === ds;
  if(e.rep === 'daily') return true;
  if(e.rep === 'weekly') return (e.days || []).includes(wdOf(ds));
  return false;
}
// Alle Vorkommen der nächsten n Tage (inkl. laufender) als {e, start, end}
function occurrences(days = 14, fromDs){
  const out = [], t0 = fromDs || addDays(todayStr(), -1), now = Date.now();
  for(let i = 0; i <= days; i++){
    const ds = addDays(t0, i);
    for(const e of S.events){
      if(!occursOn(e, ds)) continue;
      const [h, m] = (e.start || '00:00').split(':').map(Number);
      const st = parse(ds); st.setHours(h, m, 0, 0);
      let en = null;
      if(e.end){ const [h2, m2] = e.end.split(':').map(Number); en = parse(ds); en.setHours(h2, m2, 0, 0); if(en <= st) en.setDate(en.getDate() + 1); }
      const endT = en ? en.getTime() : st.getTime() + 60 * 60000;
      if(endT < now) continue;
      out.push({e, ds, start:st.getTime(), end:endT, hasEnd:!!en});
    }
  }
  return out.sort((a, b) => a.start - b.start);
}
const isLive = o => o.start <= Date.now() && Date.now() < o.end;
function evWhen(o){
  if(isLive(o)) return o.hasEnd ? `läuft noch ${fmtDur(o.end - Date.now())}` : 'jetzt';
  return `in ${fmtDur(o.start - Date.now())}`;
}
function repText(e){
  if(e.rep === 'daily') return 'täglich';
  if(e.rep === 'weekly'){ const d = (e.days || []).slice().sort(); return d.length === 7 ? 'täglich' : 'jeden ' + d.map(i => WD[i]).join(', '); }
  return fmtDay(e.date) + (e.date < todayStr() ? ' (vorbei)' : '');
}
function evRow(o, full){

    <div class="ic">${esc(e.icon || '📌')}</div>

    <div class="meta">${esc(time)} Uhr · ${esc(repText(e))}${e.remind >= 0 ? ` · 🔔 ${e.remind ? e.remind + ' Min vorher' : 'beim Start'}` : ''}</div>

}

function dropsValue(list){ let v = 0, n = 0; list.forEach(d => { const p = lastPrice(d.item); if(p){ v += p * (d.qty || 1); n++; } }); return n ? v : null; }

function priceStats(p){
  const v = p.entries.map(e => e.p);
  if(!v.length) return {};
  const recent = p.entries.filter(e => e.ts > Date.now() - 30 * 864e5).map(e => e.p);
  const base = recent.length >= 2 ? recent : v;
  const avg = base.reduce((a, b) => a + b, 0) / base.length;
  const last = v[v.length - 1], prev = v.length > 1 ? v[v.length - 2] : null;
  let hint = null;
  if(base.length >= 3){ if(last <= avg * .85) hint = 'cheap'; else if(last >= avg * 1.15) hint = 'dear'; }
  return {avg, last, prev, min:Math.min(...v), max:Math.max(...v), n:v.length, hint};
}

function chartSVG(entries){
  if(entries.length < 2) return '';
  const W = 340, H = 170, P = 28, xs = entries.map(e => e.ts), ys = entries.map(e => e.p);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) * .9, y1 = Math.max(...ys) * 1.05 || 1;
  const X = t => P + (x1 === x0 ? (W - P - 8) / 2 : (t - x0) / (x1 - x0) * (W - P - 8)), Y = v => H - 18 - (v - y0) / (y1 - y0 || 1) * (H - 30);
  const pts = entries.map(e => `${X(e.ts).toFixed(1)},${Y(e.p).toFixed(1)}`).join(' ');
  const avg = ys.reduce((a, b) => a + b, 0) / ys.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon class="ar" points="${X(x0)},${H - 18} ${pts} ${X(x1)},${H - 18}"/>
    <line class="avg" x1="${P}" x2="${W - 8}" y1="${Y(avg)}" y2="${Y(avg)}"/>
    <polyline class="ln" points="${pts}"/>
    ${entries.map(e => `<circle cx="${X(e.ts)}" cy="${Y(e.p)}" r="3" fill="#efecff"/>`).join('')}
    <text x="2" y="${Y(y1 / 1.05) + 4}">${fmtYang(y1 / 1.05)}</text><text x="2" y="${H - 20}">${fmtYang(y0 / .9)}</text>
    <text x="${P}" y="${H - 4}">${new Date(x0).toLocaleDateString('de-DE', {day:'numeric', month:'short'})}</text><text x="${W - 8}" y="${H - 4}" text-anchor="end">${new Date(x1).toLocaleDateString('de-DE', {day:'numeric', month:'short'})}</text>
  </svg>`;
}

/* ================= Sicherung ================= */
const BK_DIR = 'Metin2-Multiversum';
const backupJSON = () => JSON.stringify({app:'Metin2-Multiversum', v:1, date:new Date().toISOString(), cfg:S.cfg, events:S.events, drops:S.drops, sessions:S.sessions, prices:S.prices, active:S.active});
function importBackup(text){
  try{
    const d = JSON.parse(text); if(d.app !== 'Metin2-Multiversum') throw 0;
    const merge = (mine, theirs) => { const m = new Map(mine.map(x => [x.id, x])); let n = 0; (theirs || []).forEach(x => { const o = m.get(x.id); if(!o){ n++; m.set(x.id, x); } else if((x.changed || 0) > (o.changed || 0)) m.set(x.id, x); }); return [[...m.values()], n]; };
    let n1, n2, n3;
    [S.events, n1] = merge(S.events, d.events); [S.drops, n2] = merge(S.drops, d.drops); [S.sessions] = merge(S.sessions, d.sessions);
    // Preise: pro Item zusammenführen
    (d.prices || []).forEach(p => { const o = S.prices.find(x => x.item.toLowerCase() === p.item.toLowerCase()); if(!o) S.prices.push(p); else { const ks = new Set(o.entries.map(e => e.ts + '|' + e.p)); p.entries.forEach(e => { if(!ks.has(e.ts + '|' + e.p)) o.entries.push(e); }); o.entries.sort((a, b) => a.ts - b.ts); } });
    S.drops.sort((a, b) => b.ts - a.ts); S.sessions.sort((a, b) => b.start - a.start);
    if(d.cfg && !S.cfg.char) S.cfg = Object.assign(S.cfg, d.cfg, {notify:S.cfg.notify});
    saveEvents(); saveDrops(); saveSessions(); savePrices(); saveCfg(); closeSheet(); renderAll();
    toast(`Eingefügt: ${n1} Events, ${n2} Drops`);
  }catch(e){ toast('Das ist keine gültige Sicherung'); }
}
let _bkT;
function autoBackup(){ if(!NATIVE) return; clearTimeout(_bkT); _bkT = setTimeout(() => writeBackup(false), 3000); }
async function writeBackup(manual){
  const FS = plug('Filesystem');
  if(!FS){ if(manual){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupJSON()], {type:'application/json'})); a.download = `metin2-multiversum-${todayStr()}.json`; a.click(); } return; }
  try{
    try{ const p = await FS.checkPermissions(); if(p.publicStorage !== 'granted') await FS.requestPermissions(); }catch(e){}
    await FS.writeFile({path:`${BK_DIR}/sicherung-${todayStr()}.json`, data:backupJSON(), directory:'DOCUMENTS', encoding:'utf8', recursive:true});
    store('m2_lastbk', Date.now()); renderBackupInfo();
    try{
      const r = await FS.readdir({path:BK_DIR, directory:'DOCUMENTS'});
      const files = (r.files || []).map(f => typeof f === 'string' ? f : f.name).filter(n => /^sicherung-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort();
      for(const n of files.slice(0, Math.max(0, files.length - 7))) await FS.deleteFile({path:`${BK_DIR}/${n}`, directory:'DOCUMENTS'}).catch(() => {});
    }catch(e){}
    if(manual) toast('💾 Gesichert in Dokumente/Metin2-Multiversum');
  }catch(e){ if(manual) toast('Sicherung fehlgeschlagen: ' + (e.message || e)); }
}
function renderBackupInfo(){
  const el = $('#s-bk'); if(!el) return;
  const t = store('m2_lastbk');
  el.textContent = !NATIVE ? 'Im Browser: „Jetzt sichern“ lädt eine Datei herunter.' : t ? `Automatisch täglich · zuletzt ${new Date(t).toLocaleString('de-DE', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})} Uhr` : 'Noch keine Sicherung';
}

async function checkUpdate(manual){
  if(!APP_BUILD && !manual) return;
  try{
    let r;
    try{ r = await fetch(UPDATE_INFO + '?t=' + Date.now(), {cache:'no-store'}); }
    catch(e){ if(manual) toast('Keine Verbindung – bist du online?'); return; }
    if(!r.ok){ if(manual) toast(r.status === 404 ? 'Update-Info nicht gefunden – ist das GitHub-Repo öffentlich?' : `Update-Server antwortet nicht (Fehler ${r.status})`); return; }
    const v = await r.json();
    const build = parseInt(v.build, 10);
    S.update = (build > APP_BUILD && v.apk) ? {build, url:v.apk, notes:v.notes || '', size:v.size} : null;
    renderUpdateInfo();
    if(S.update){ if(manual || store('m2_upd_skip') !== build) showUpdateSheet(); }
    else if(manual) toast('Du hast die neueste Version');
  }catch(e){ if(manual) toast('Update-Info ist fehlerhaft'); }
}
function renderUpdateInfo(){
  const el = $('#upd-info'); if(!el) return;
  el.innerHTML = `Version 1.${APP_BUILD || '–'}` + (S.update ? ` · <b style="color:var(--acc)">1.${S.update.build} verfügbar</b>` : '');
}

  const notes = u.notes.replace(/\r/g, '').replace(/^#+\s*/gm, '').replace(/\*\*/g, '').trim();
  openSheet(`
    <h2 style="margin:0 0 4px">Neue Version 1.${u.build}</h2>
    <p class="muted" style="margin:0 0 10px">Du hast 1.${APP_BUILD}.${u.size ? ` Download ca. ${(u.size / 1048576).toLocaleString('de-DE', {maximumFractionDigits:1})} MB.` : ''}</p>
    ${notes ? `<div style="white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px">${esc(notes)}</div>` : ''}
    <div class="btns"><button class="btn pri" id="u-go">Jetzt aktualisieren</button><button class="btn" id="u-later">Später</button></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Die neue APK wird im Browser geladen. Danach auf die Datei tippen und „Installieren" wählen. Deine Daten bleiben erhalten.</p>`);
  $('#u-go').onclick = () => openUrl(u.url);
  $('#u-later').onclick = () => { store('m2_upd_skip', u.build); closeSheet(); };
}

/* ================= Erinnerungen (lokale Benachrichtigungen) ================= */
const hashId = str => { let h = 0; for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; };
let _schedT;
function scheduleReminders(){ if(!NATIVE) return; clearTimeout(_schedT); _schedT = setTimeout(doSchedule, 800); }
async function doSchedule(){
  const LN = plug('LocalNotifications'); if(!LN) return;
  try{
    const pend = await LN.getPending();
    if(pend.notifications && pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n => ({id:n.id}))});
    if(!S.cfg.notify) return;
    const perm = await LN.checkPermissions(); if(perm.display !== 'granted') return;
    const now = Date.now(), list = [];
    occurrences(21, todayStr()).forEach(o => {
      const e = o.e; if(e.remind == null || e.remind < 0) return;
      const at = o.start - e.remind * 60000;
      if(at <= now + 5000) return;
      list.push({id:hashId(e.id + o.ds), title:`${e.icon || '🔔'} ${e.name}`, body:(e.remind ? `In ${e.remind >= 60 ? (e.remind / 60) + ' Std' : e.remind + ' Min'} · ${e.start} Uhr` : `Jetzt · ${e.start} Uhr`) + (e.end ? ` bis ${e.end}` : '') + ` auf ${S.cfg.server}` + (e.note ? `\n${e.note}` : ''), schedule:{at:new Date(at), allowWhileIdle:true}, extra:{ev:e.id}});
    });
    // Forum: Drop-Events (markiert oder alle) und große Events
    offOccurrences(7, todayStr()).forEach(o => {
      const want = o.off === 'news' ? S.cfg.newsNotify : offWanted(o.e.name);
      if(!want) return;
      const lead = o.off === 'news' ? 0 : (S.cfg.remind || 0);
      const at = o.start - lead * 60000;
      if(at <= now + 5000) return;
      const srv = shortServer((myPlan() || {}).server) || S.cfg.server;
      list.push({id:hashId(o.e.id + o.ds + o.e.start), title:o.off === 'news' ? `🎉 Event startet: ${o.e.name}` : `🎁 ${o.e.name}-Event ${lead ? 'in ' + lead + ' Min' : 'startet'}`,
        body:o.off === 'news' ? `${o.e.note || ''} – bis ${new Date(o.end).toLocaleString('de-DE', {weekday:'short', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'})} Uhr` : `${o.e.start}–${o.e.end} Uhr auf ${srv} · ${o.e.note}`, schedule:{at:new Date(at), allowWhileIdle:true}, extra:{off:1}});
    });
    list.sort((a, b) => a.schedule.at - b.schedule.at);
    if(list.length) await LN.schedule({notifications:list.slice(0, 60)});
  }catch(e){ console.log('Erinnerungen:', e); }
}
async function askNotify(force){
  const LN = plug('LocalNotifications'); if(!LN) return;
  try{ let p = await LN.checkPermissions(); if(p.display !== 'granted' && (force || !store('m2_asked'))){ store('m2_asked', 1); p = await LN.requestPermissions(); } }catch(e){}
  scheduleReminders();
}
async function renderNotifyInfo(){
  const el = $('#s-notinfo'); if(!el) return;
  if(!NATIVE){ el.textContent = 'nur in der Android-App'; return; }
  try{ const p = await plug('LocalNotifications').checkPermissions(); el.textContent = !S.cfg.notify ? 'aus' : p.display === 'granted' ? 'aktiv – für Events & Forum-Termine' : 'Bitte Benachrichtigungen erlauben (Android-Einstellungen)'; }catch(e){ el.textContent = ''; }
}
if(NATIVE){
  try{ plug('LocalNotifications').addListener('localNotificationActionPerformed', () => { closeSheet(); showView('events'); }); }catch(e){}
}

$('#logo').onerror = () => { $('#logo').style.display = 'none'; };
showView('home'); renderBadges();
loadWiki();
setTimeout(maybeRefreshOff, 600);
setInterval(() => { if(document.hidden) return; renderBadges(); if(S.view === 'home') renderHome(); else if(S.view === 'events') renderEvents(); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ renderBadges(); maybeRefreshOff(); if(S.view === 'home') renderHome(); else if(S.view === 'events') renderEvents(); } });
setTimeout(() => checkUpdate(false), 2500);
if(NATIVE){
  setTimeout(async () => { if(S.cfg.notify) await askNotify(false); scheduleReminders(); }, 1200);
  { const t = store('m2_lastbk'); if(!t || ymd(new Date(t)) !== todayStr()) setTimeout(() => writeBackup(false), 4000); }
}
