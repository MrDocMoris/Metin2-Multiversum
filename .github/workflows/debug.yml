name: Debug HTML (temporaer)
on:
  push:
    branches: [debug-html]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dbg
          B=https://de-wiki.metin2.gameforge.com/index.php
          i=0
          for u in "$B/Hauptseite" "$B/Alchemie" "$B/Drachenstein" "$B/Kategorie:Quests" "$B/Biologe" "$B?title=Spezial:Alle_Seiten&hideredirects=1"; do
            i=$((i+1)); curl -sL -A "Mozilla/5.0 (Metin2-Multiversum)" "$u" -o "dbg/$i.html" -w "$i %{http_code} %{url_effective}\n"; sleep 2
          done
          ls -la dbg
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add dbg; git commit -m "debug html 4"; git push
