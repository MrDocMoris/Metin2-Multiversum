name: Debug HTML (temporaer)
on:
  push:
    branches: [debug-html]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dbg
          B=https://board.de.metin2.gameforge.com/index.php
          i=0
          for u in "$B?board/1167-news-events/" "$B?board/24-news-game/" "$B?thread/90381-eventkalender/" "$B?thread/134893-events-im-doppelpack-schatzsuche-und-anderwelt/" "$B?thread/132714-metin2-de-ruby-ardyh/" "https://board.en.metin2.gameforge.com/index.php?thread/103715-events-november-2026/" "https://board.en.metin2.gameforge.com/index.php?board/176-events/"; do
            i=$((i+1)); curl -sL -A "Mozilla/5.0 (Metin2-Multiversum)" "$u" -o "dbg/$i.html" -w "$i %{http_code} %{url_effective}\n"; sleep 2
          done
          ls -la dbg
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add dbg; git commit -m "debug html 2"; git push
